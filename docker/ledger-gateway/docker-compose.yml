services:
  ledger-gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${LEDGER_GATEWAY_PUBLISH_PORT:8080}:${LEDGER_GATEWAY_PORT:8080}"
    environment:
      LEDGER_GATEWAY_PORT: ${LEDGER_GATEWAY_PORT:-8080}
      LEDGER_GATEWAY_SECRET: ${LEDGER_GATEWAY_SECRET:?Set LEDGER_GATEWAY_SECRET}
      LEDGER_UPSTREAM: ${LEDGER_UPSTREAM:?Set LEDGER_UPSTREAM to the VPN-only JSON Ledger API origin}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
