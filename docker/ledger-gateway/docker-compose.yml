services:
  ledger-gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${LEDGER_GATEWAY_PUBLISH_PORT:-8080}:${LEDGER_GATEWAY_PORT:-8080}"
    environment:
      LEDGER_GATEWAY_PORT: ${LEDGER_GATEWAY_PORT:-8080}
      LEDGER_GATEWAY_SECRET: ${LEDGER_GATEWAY_SECRET:?Set LEDGER_GATEWAY_SECRET}
      LEDGER_GATEWAY_HOSTNAME: ${LEDGER_GATEWAY_HOSTNAME:?Set LEDGER_GATEWAY_HOSTNAME}
      LEDGER_UPSTREAM: ${LEDGER_UPSTREAM:?Set LEDGER_UPSTREAM}
      LEDGER_UPSTREAM_HOST: ${LEDGER_UPSTREAM_HOST:?Set LEDGER_UPSTREAM_HOST}
      VALIDATOR_GATEWAY_HOSTNAME: ${VALIDATOR_GATEWAY_HOSTNAME:?Set VALIDATOR_GATEWAY_HOSTNAME}
      VALIDATOR_UPSTREAM: ${VALIDATOR_UPSTREAM:?Set VALIDATOR_UPSTREAM}
      VALIDATOR_UPSTREAM_HOST: ${VALIDATOR_UPSTREAM_HOST:?Set VALIDATOR_UPSTREAM_HOST}
      AUTH_GATEWAY_HOSTNAME: ${AUTH_GATEWAY_HOSTNAME:?Set AUTH_GATEWAY_HOSTNAME}
      AUTH_UPSTREAM: ${AUTH_UPSTREAM:?Set AUTH_UPSTREAM}
      AUTH_UPSTREAM_HOST: ${AUTH_UPSTREAM_HOST:?Set AUTH_UPSTREAM_HOST}
    volumes:
      - ./generate-caddyfile.sh:/generate-caddyfile.sh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "/generate-caddyfile.sh"]
